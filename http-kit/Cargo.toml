[package]
name = "http-kit"
description = "HTTP request and response helpers: pagination, ordering, projection, e.t.c."
authors.workspace = true
version.workspace = true
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
default = ["ordering", "offset-pagination", "cursor-pagination", "response", "utoipa", "patch-request", "with-pgkit"]
ordering          = []
offset-pagination = []
cursor-pagination = []
patch-request     = ["dep:field-delta"]
projection        = ["dep:thiserror", "dep:valid8r", "dep:http-kit-macros"]
response          = ["offset-pagination", "cursor-pagination", "dep:axum", "dep:serde_json", "dep:bon", "dep:strum", "dep:chrono"]
axum              = ["response", "dep:thiserror", "dep:valid8r", "dep:tracing", "dep:serde_path_to_error"]
macros     = ["ordering", "dep:http-kit-macros"]
utoipa     = ["dep:utoipa", "field-delta?/utoipa"]
with-pgkit = ["ordering", "dep:pgkit"]

[dependencies]
serde = { workspace = true }
axum       = { version = "0.8", features = ["macros"], optional = true }
bon        = { version = "3.8", optional = true }
chrono     = { version = "0.4.40", features = ["serde"], optional = true }
serde_json = { workspace = true, optional = true }
strum      = { workspace = true, optional = true }
thiserror  = { version = "2.0", optional = true }
utoipa     = { workspace = true, optional = true }
tracing    = { version = "0.1", optional = true }
serde_path_to_error = { version = "0.1", optional = true }

field-delta = { version = "0.1.0", optional = true }
pgkit       = { version = "0.4.0", optional = true, default-features = false }
valid8r     = { version = "0.2.2", optional = true }

# ––– Workspace members –––
http-kit-macros = { path = "../http-kit-macros", optional = true }

[dev-dependencies]
serde_json = { workspace = true }
tokio      = { version = "1.42.0", features = ["full"] }
