[package]
name = "restful"
description = "REST API helpers: validated Axum extractors, response envelopes, pagination, ordering, and field selection"
authors.workspace = true
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["rest", "api", "axum", "pagination", "validation"]
categories = ["web-programming"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true

[features]
default       = ["response"]
full          = ["response", "axum", "projection", "macros", "field-delta", "pgkit", "utoipa"]
field-delta   = ["dep:field-delta"]
projection    = ["dep:thiserror", "dep:valid8r"]
response      = ["dep:axum", "dep:serde_json", "dep:strum"]
axum          = ["response", "dep:thiserror", "dep:valid8r", "dep:tracing", "dep:serde_path_to_error"]
macros        = ["dep:restful-macros"]
utoipa        = ["dep:utoipa", "field-delta?/utoipa"]
pgkit         = ["dep:pgkit"]

[dependencies]
serde               = { workspace = true }
axum                = { version = "0.8", optional = true }
serde_json          = { workspace = true, optional = true }
strum               = { workspace = true, optional = true }
thiserror           = { version = "2.0", optional = true }
utoipa              = { workspace = true, optional = true }
tracing             = { version = "0.1", optional = true }
serde_path_to_error = { version = "0.1", optional = true }
field-delta         = { version = "0.1.0", optional = true }
pgkit               = { version = "0.4.0", optional = true, default-features = false }
valid8r             = { version = "0.2.2", optional = true }

# ––– Workspace members –––
restful-macros = { path = "../restful-macros", version = "=0.1.1", optional = true }

[dev-dependencies]
serde_json = { workspace = true }
tokio      = { version = "1.42.0", features = ["full"] }
