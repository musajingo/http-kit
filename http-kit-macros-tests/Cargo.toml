[package]
name = "http-kit-macros-tests"
description = "http-kit proc-macros tests"
authors.workspace = true
version.workspace = true
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

[dev-dependencies]
trybuild     = "1.0"
serde        = { workspace = true }
serde_json   = { workspace = true }
utoipa       = { workspace = true }
strum        = { workspace = true }
validator    = { git = "https://github.com/musajingo/validator", tag = "v0.1.0" }
pgkit        = { git = "https://github.com/musajingo/pgkit", tag = "v0.4.0", default-features = false }
http-kit        = { path = "../http-kit", features = ["offset-pagination", "cursor-pagination", "utoipa", "macros", "projection"] }
http-kit-macros = { path = "../http-kit-macros" }
