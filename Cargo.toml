[workspace]
members = ["http-kit", "http-kit-macros", "http-kit-macros-tests"]
resolver = "3"

[workspace.package]
authors = ["Musa Mahmoud Jingo <dev.musajingo@pm.me>"]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.dependencies]
serde      = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", default-features = false, features = ["std"] }
strum      = { version = "0.28", features = ["derive"] }
utoipa     = { version = "5", default-features = false, features = ["macros", "axum_extras", "chrono"] }
